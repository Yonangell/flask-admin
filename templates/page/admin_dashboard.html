{% extends "_base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Gestión de Usuarios</h1>
    <div class="flex gap-4">
        <a href="{{ url_for('create_user') }}" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-700 transition shadow-sm">
            + Nuevo Usuario
        </a>
        <a href="{{ url_for('toggle_role') }}" class="bg-amber-100 text-amber-700 px-4 py-2 rounded-full text-sm font-bold border border-amber-200 hover:bg-amber-200 transition">
            Modo: Administrador (Click para cambiar)
        </a>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto"> <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Usuario</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Rol</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                {% for user in users %}
                <tr class="hover:bg-gray-50 transition">
                    <form action="{{ url_for('update_user', id=user.id) }}" method="POST">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <input type="text" name="username" value="{{ user.username }}" 
                                   class="text-sm font-medium text-gray-900 border border-gray-100 rounded px-2 py-1 min-w-[120px]">
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <input type="email" name="email" value="{{ user.email }}" 
                                   class="text-sm text-gray-500 border border-gray-100 rounded px-2 py-1 min-w-[200px]">
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <select name="role" class="...">
                                <option value="user" {{ 'selected' if user.role == 'user' }}>user</option>
                                <option value="admin" {{ 'selected' if user.role == 'admin' }}>admin</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <div class="flex justify-end gap-3 min-w-[150px]">
                                <button type="submit" class="text-blue-600 hover:text-blue-900 font-bold">Actualizar</button>
                                <a href="{{ url_for('delete_user', id=user.id) }}" class="text-red-600 hover:text-red-900" onclick="return confirm('¿Eliminar?')">Eliminar</a>
                            </div>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
