{% extends "_base.html" %} {% block content %}
<div
  class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 mt-10"
>
  <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">
    Bienvenido de nuevo
  </h2>
  <p class="text-sm text-gray-500 text-center mb-6">
    Ingresa tus credenciales para acceder
  </p>

  <form method="POST">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >Correo Electrónico</label
        >
        <input
          type="email"
          name="email"
          required
          placeholder="correo@ejemplo.com"
          class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >Contraseña</label
        >
        <input
          type="password"
          name="password"
          required
          placeholder="••••••••"
          class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300 shadow-lg shadow-indigo-200"
      >
        Iniciar Sesión
      </button>
    </div>
  </form>

  <div class="mt-6 text-center text-sm text-gray-600">
    ¿No tienes una cuenta?
    <a
      href="{{ url_for('register') }}"
      class="text-indigo-600 font-medium hover:underline"
      >Regístrate aquí</a
    >
  </div>
</div>
{% endblock %}
