{% extends "_base.html" %} {% block content %}
<div
  class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 mt-10"
>
  <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
    Crear Cuenta
  </h2>
  <form method="POST">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Usuario</label>
        <input
          type="text"
          name="username"
          required
          class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          name="email"
          required
          class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >Contraseña</label
        >
        <input
          type="password"
          name="password"
          required
          class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300 shadow-lg shadow-indigo-200"
      >
        Registrarme
      </button>
    </div>
  </form>
</div>
{% endblock %}
